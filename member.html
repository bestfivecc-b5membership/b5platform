<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B5 Admin Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF6F0;
            color: #4A3419;
        }
        .premium-shadow {
            box-shadow: 0 10px 25px -5px rgba(99, 58, 17, 0.06);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes custom-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.15); }
        }
        .gift-bounce {
            animation: custom-bounce 1.2s infinite ease-in-out;
            display: inline-block;
        }
    </style>
</head>
<body class="pb-24">

    <!-- 原汁原味保留的成功横幅提示 -->
    <div id="receiptNotice" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] w-11/12 max-w-sm bg-emerald-600 text-white p-4 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-sm">✅</div>
            <div class="flex-1">
                <h4 class="font-extrabold text-sm tracking-wide">Redeem Successful!</h4>
                <p id="receiptDetails" class="text-[11px] text-emerald-100 mt-0.5">Item processed securely.</p>
            </div>
            <button onclick="closeReceipt()" class="text-white/60 hover:text-white text-xs font-bold px-2">Dismiss</button>
        </div>
    </div>

    <!-- 详情说明弹窗（大宽屏复用） -->
    <div id="detailsModal" class="fixed inset-0 z-[110] bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-all duration-300" id="modalContainer">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 id="modalTitle" class="font-extrabold text-base text-[#633A11]">Rules & Details</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modalBody" class="mt-4 text-xs text-gray-600 space-y-3 leading-relaxed"></div>
        </div>
    </div>

    <!-- 顶部导航条：采用大宽屏样式，双击切换 STAFF 状态 -->
    <header id="topBar" ondblclick="triggerAdminToggle()" class="bg-[#633A11] text-white px-5 py-4 sticky top-0 z-50 shadow-md flex justify-between items-center w-full select-none cursor-pointer transition-colors duration-300">
        <div class="w-16 text-xs font-bold text-amber-400" id="adminIndicator"></div>
        <h1 class="text-base font-extrabold flex items-center gap-2 tracking-wide text-center">🎁 B5 Admin Portal</h1>
        <div class="w-16 flex justify-end items-center">
            <div id="syncIndicator" class="opacity-0 transition-opacity duration-300 text-emerald-400 text-xs"><i class="fa-solid fa-rotate animate-spin"></i></div>
        </div>
    </header>

    <!-- 主容器：支持 md 和 lg 的宽屏响应式布局网格 -->
    <div class="max-w-md md:max-w-6xl mx-auto px-4 mt-6">

        <!-- 搜素框 -->
        <div class="bg-white rounded-3xl p-6 border border-[#F2E4D4] premium-shadow max-w-md mx-auto" id="searchBox">
            <h3 id="searchTitle" class="text-base font-extrabold text-[#633A11] mb-4 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Member Lookup
            </h3>
            <div class="flex flex-col gap-3">
                <input id="phone" type="text" placeholder="Phone Number" onblur="normalizePhone(this)" class="w-full bg-[#FAF6F0] border border-[#EADCC9] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#633A11] transition">
                <input id="email" type="email" placeholder="Email" class="w-full bg-[#FAF6F0] border border-[#EADCC9] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#633A11] transition">
                <button onclick="startManualSearch()" class="w-full bg-[#633A11] hover:bg-[#4A2B0C] text-white font-bold py-3 rounded-xl transition mt-2 shadow-md cursor-pointer">
                    Search Profile
                </button>
            </div>
        </div>

        <!-- 会员详情数据展示网格（渲染时应用多列排版） -->
        <div id="result" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>

    </div>

<script>
// ==================== 全局核心变量定义 ====================
let isStaffMode = false; 
let autoRefreshTimer = null; 
let isCatalogExpanded = false; 
let cachedMemberData = null; 

window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const phoneParam = urlParams.get('phone');
    const emailParam = urlParams.get('email');
    if (phoneParam || emailParam) {
        if (phoneParam) { const p = document.getElementById("phone"); p.value = phoneParam; normalizePhone(p); }
        if (emailParam) { document.getElementById("email").value = emailParam; }
        startManualSearch();
    }
});

// ⚡ 完美修复版：双击切换 Staff Mode 逻辑（修复关闭时 STAFF 标签残留问题 + 退出免密）
async function triggerAdminToggle() {
    const indicator = document.getElementById("adminIndicator");
    const topBar = document.getElementById("topBar");

    // 🌟 核心优化：如果已经是 Staff Mode，双击立刻直接退出，不需要再输入密码
    if (isStaffMode) {
        isStaffMode = false;
        
        // 立刻清除左上角和颜色
        if (indicator) indicator.innerHTML = "";
        if (topBar) topBar.classList.replace("bg-[#4A1D1D]", "bg-[#633A11]");
        
        // 关键修复：关闭时如果有会员数据，立刻刷新网络数据，没有则重绘 UI
        if (cachedMemberData) {
            await executeRefreshAfterRedeem();
        } else {
            renderAllUI(cachedMemberData);
        }
        alert("Switched back to Customer Mode.");
        return; // 直接结束，不往下走密码验证
    }

    // --- 以下是进入 Staff Mode 的密码验证逻辑 ---
    const inputPasscode = prompt("B5 System: Please enter Staff Passcode to toggle mode:");
    
    if (inputPasscode === null) return; 
    if (inputPasscode.trim() === "") {
        alert("Passcode cannot be empty.");
        return;
    }

    const baseUrl = "https://script.google.com/macros/s/AKfycbyw_wc2HirKbFq6Yn6sL2YC_SpXZb0J5K2Kd-k0uKYfRTwhXHg6sy_RbFzSYV6w8NCp5A/exec";
    const url = `${baseUrl}?mode=verify_staff_mode&passcode=${encodeURIComponent(inputPasscode.trim())}`;

    try {
        console.log("Verifying staff passcode...");
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "ok") {
            isStaffMode = true; // 进入 Staff Mode
            
            // 展现 STAFF 视觉状态
            if (indicator) {
                indicator.innerHTML = "<span class='bg-rose-950/50 px-2 py-0.5 rounded text-[10px] text-rose-300 font-black animate-pulse'>STAFF</span>";
            }
            if (topBar) {
                topBar.classList.replace("bg-[#633A11]", "bg-[#4A1D1D]");
            }
            alert("Successfully switched to Staff Mode.");
            
            // 自动同步最新数据
            if (cachedMemberData) {
                await executeRefreshAfterRedeem();
            } else {
                renderAllUI(cachedMemberData);
            }
        } else {
            alert("Invalid Passcode! Access Denied.");
        }
    } catch (err) {
        console.error("Verification error:", err);
        alert("Network error. Failed to verify passcode.");
    }
}

function openModal(type) {
    const modal = document.getElementById("detailsModal");
    const container = document.getElementById("modalContainer");
    const title = document.getElementById("modalTitle");
    const body = document.getElementById("modalBody");
    const s = cachedMemberData?.settings || {};
    
    if(type === 'stamp') {
        title.innerHTML = "📊 Stamp Card Policy";
        body.innerHTML = `
            <ul class="list-disc pl-4 space-y-2 font-medium text-gray-700">
                <li class="text-red-600 font-bold">🔄 Monthly Visit Stamps reset automatically on the 1st day of every month!</li>
                <li>Each valid counter check-in grants you 1 visit stamp.</li>
                <li>Unlock milestone rewards when you collect 3 and 7 stamps within the calendar month.</li>
            </ul>`;
    } else if(type === 'tier' || type === 'referral_details') {
        title.innerHTML = "👥 Referral Journey Milestones";
        body.innerHTML = `
            <div class="space-y-3">
                <p class="font-bold text-gray-600 text-xs">Invite friends to unlock direct rewards and lifetime shop discounts:</p>
                <div class="border-t border-gray-100 pt-2 space-y-2 text-xs">
                    <div class="bg-[#FAF6F0] p-2 rounded-xl border border-[#EADCC9]/50">
                        <span class="font-extrabold text-[#633A11]">👤 0-8 Invites:</span> Standard Member (0% Off)
                    </div>
                    <div class="bg-amber-50 p-2 rounded-xl border border-amber-200/50">
                        <span class="font-extrabold text-amber-800">🥉 3 & 6 & 9 Invites Milestone Rewards:</span>
                        <p class="text-gray-500 mt-0.5">🎁 3 Ref: ${s.referralMilestone3 || "-"}</p>
                        <p class="text-gray-500">🎁 6 Ref: ${s.referralMilestone6 || "-"}</p>
                        <p class="text-gray-500">🎁 9 Ref: ${s.referralMilestone9 || "-"}</p>
                        <p class="text-amber-700 font-bold mt-1">✨ Hit 9 Invites to unlock Bronze Tier (5% Lifetime Discount!)</p>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-xl border border-slate-200/50">
                        <span class="font-extrabold text-slate-800">🥈 20+ Invites (Silver Tier):</span> 10% Lifetime Discount
                    </div>
                    <div class="bg-yellow-50 p-2 rounded-xl border border-yellow-200/50">
                        <span class="font-extrabold text-yellow-800">🥇 35+ Invites (Gold Tier):</span> 15% Lifetime Discount
                    </div>
                    <div class="bg-cyan-50 p-2 rounded-xl border border-cyan-200/50">
                        <span class="font-extrabold text-cyan-800">💎 50+ Invites (Platinum Tier):</span> 20% Lifetime Discount
                    </div>
                </div>
            </div>`;
    }
    modal.classList.remove("opacity-0", "pointer-events-none");
    container.classList.remove("scale-95");
}

function closeModal() {
    const modal = document.getElementById("detailsModal");
    const container = document.getElementById("modalContainer");
    modal.classList.add("opacity-0", "pointer-events-none");
    container.classList.add("scale-95");
}

function toggleCatalogView() {
    isCatalogExpanded = !isCatalogExpanded;
    if(cachedMemberData) {
        renderAllUI(cachedMemberData);
    }
}

function showReceipt(itemName, staffName) {
    const notice = document.getElementById("receiptNotice");
    document.getElementById("receiptDetails").innerHTML = `<b>Item:</b> ${itemName}<br><b>Staff:</b> ${staffName}`;
    notice.classList.remove("opacity-0", "pointer-events-none", "translate-y-[-20px]");
    setTimeout(closeReceipt, 5000);
}

function closeReceipt() {
    document.getElementById("receiptNotice").classList.add("opacity-0", "pointer-events-none", "translate-y-[-20px]");
}

function resetPortal() {
    if(autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    location.reload();
}

function formatDateOnly(dateStr){
    if(!dateStr) return "-";
    const d = new Date(dateStr);
    return d.toLocaleDateString("en-CA");
}

function checkIsExpired(expiryStr) {
    if(!expiryStr) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const exp = new Date(expiryStr); exp.setHours(0,0,0,0);
    return today > exp;
}

function normalizePhone(input){
    let phone=input.value.replace(/[^0-9]/g,"");
    if(phone.startsWith("0")) phone="6"+phone;
    if(!phone.startsWith("60")) phone="60"+phone;
    input.value=phone;
}

function startManualSearch() {
    if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    search(true); 
    autoRefreshTimer = setInterval(() => { silentUpdate(); }, 5000);
}

// 按钮状态生成器（原汁原味逻辑，适配样式）
const renderActionBtnHtml = (isAvailable, isRedeemed, isExpired, onClickStr, uniqueId) => {
    if (isExpired) return `<span id="${uniqueId}" class="text-[10px] text-red-500 font-extrabold bg-red-50 px-2 py-1 rounded-lg border border-red-200 select-none cursor-default">Expired</span>`;
    if (isRedeemed) return `<span id="${uniqueId}" class="text-[10px] text-gray-400 font-bold bg-gray-100 px-2.5 py-1 rounded-lg select-none cursor-default">Used</span>`;
    if (!isAvailable) return `<span id="${uniqueId}" class="text-[9px] text-gray-400 font-semibold bg-gray-50 px-2 py-1 rounded-lg border border-dashed select-none cursor-default">Locked</span>`;
    
    if (isStaffMode) {
        return `<button id="${uniqueId}" onclick="${onClickStr}" class="bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-black px-3 py-1 rounded-lg shadow-sm transition active:scale-95 cursor-pointer">REDEEM</button>`;
    } else {
        return `<span id="${uniqueId}" class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-1 rounded-lg cursor-default select-none">Available</span>`;
    }
};

// ==================== 会员信息主线搜索网关 ====================
async function search(showLoading = false){
    let phone=document.getElementById("phone").value.trim();
    let email=document.getElementById("email").value.trim();
    if(!phone && !email) return;

    if(showLoading) {
        document.getElementById("result").innerHTML="<div class='col-span-full text-center py-10 text-[#8C745A] font-medium'><i class='fa-solid fa-circle-notch animate-spin mr-2'></i>Loading Profile...</div>";
    }

    let url="https://script.google.com/macros/s/AKfycbyw_wc2HirKbFq6Yn6sL2YC_SpXZb0J5K2Kd-k0uKYfRTwhXHg6sy_RbFzSYV6w8NCp5A/exec?mode=member";
    if(phone) url+="&phone="+phone;
    if(email) url+="&email="+email;

    try {
        let res=await fetch(url);
        let data=await res.json();
        if(data.status!=="ok") {
            document.getElementById("result").innerHTML="<div class='col-span-full bg-white border border-[#F2E4D4] rounded-2xl p-6 text-center text-[#8C745A] premium-shadow max-w-md mx-auto'>No member record found</div>";
            return;
        }

        cachedMemberData = data.data; 
        document.getElementById("searchBox").style.display="none";
        renderAllUI(cachedMemberData);

    } catch(err) { console.error(err); }
}

// ==================== 🛠️ 全量高级感 UI 渲染处理器（电脑端多分栏布局） ====================
function renderAllUI(m) {
    // 🌟 极其重要：每次全量重绘时，强制校准左上角 STAFF 标签，防止网络刷新后状态残留
    const globalIndicator = document.getElementById("adminIndicator");
    const globalTopBar = document.getElementById("topBar");
    if (!isStaffMode && globalIndicator) {
        globalIndicator.innerHTML = "";
        if (globalTopBar) globalTopBar.className = "bg-[#633A11] text-white px-5 py-4 sticky top-0 z-50 shadow-md flex justify-between items-center w-full select-none cursor-pointer transition-colors duration-300";
    }

const voucherScrollBox = document.getElementById("voucherScrollContainer");
    const savedScrollLeft = voucherScrollBox ? voucherScrollBox.scrollLeft : 0;

    const stamp = m.stamp || { current:0, limit:7 };
    const referral = m.referral || { total:0, tier:"Member" };
    const settings = m.settings || {};
    const points = m.points || { balance:0, expiry:"-" };

    let tierName = "👤 Member"; let tierDiscount = "0% Discount";
    if(referral.total >= 50) { tierName = "💎 Platinum"; tierDiscount = "20% Discount"; }
    else if(referral.total >= 35) { tierName = "🥇 Gold"; tierDiscount = "15% Discount"; }
    else if(referral.total >= 20) { tierName = "🥈 Silver"; tierDiscount = "10% Discount"; }
    else if(referral.total >= 9) { tierName = "🥉 Bronze"; tierDiscount = "5% Discount"; }

    const spinExp = checkIsExpired(m.reward?.expiry);
    const bdayExp = checkIsExpired(m.birthdayReward?.expiry);
    const promoExp = checkIsExpired(m.promoReward?.expiry);

    const isStamp3UnlockedAndAvailable = (stamp.current >= 3 && !m.stamp3_redeemed);
    const isStamp7UnlockedAndAvailable = (stamp.current >= 7 && !m.stamp7_redeemed);

    const isRef3UnlockedAndAvailable = (referral.total >= 3 && !m.ref3_redeemed);
    const isRef6UnlockedAndAvailable = (referral.total >= 6 && !m.ref6_redeemed);
    const isRef9UnlockedAndAvailable = (referral.total >= 9 && !m.ref9_redeemed);

    const milestones = [3, 6, 9, 20, 35, 50];

    let htmlContent = `
        <!-- 顶部操作栏（新增了右侧的手动刷新按钮） -->
        <div class="col-span-full flex justify-between items-center mt-2 mb-1">
            <button onclick="resetPortal()" class="bg-white border border-[#EADCC9] text-[#633A11] text-xs font-bold px-4 py-2 rounded-xl transition premium-shadow flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> New Lookup
            </button>
            
            <!-- 🔄 Admin 手动刷新数据组件（点一次才跑一次，绝不自动消耗） -->
            <button id="manualRefreshBtn" onclick="executeRefreshAfterRedeem()" class="bg-white hover:bg-amber-50/50 text-[#633A11] text-[11px] font-bold px-3 py-1.5 rounded-xl border border-[#EADCC9]/60 shadow-sm transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
                <div id="syncIndicator" class="w-1.5 h-1.5 bg-emerald-500 rounded-full opacity-0 transition-opacity duration-300"></div>
                <i class="fa-solid fa-arrows-rotate text-xs"></i>
                <span>Refresh Data</span>
            </button>
        </div>

        <!-- 栏目 1：会员主卡片 (在 PC 端占 1 列) -->
        <section class="bg-[#633A11] text-[#FAF6F0] rounded-3xl p-6 premium-shadow relative overflow-hidden flex flex-col justify-between min-h-[220px] lg:col-span-1">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-[#B87E31] opacity-20 rounded-full blur-2xl"></div>
            <div class="flex justify-between items-start z-10">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-[#C2B2A2] tracking-widest uppercase">Available Points</span>
                    <div class="flex items-baseline gap-1.5 mt-1">
                        <span id="livePoints" class="text-5xl font-extrabold text-white">${points.balance}</span>
                        <span class="text-xs font-extrabold text-amber-400 uppercase tracking-wider">Pts</span>
                    </div>
                </div>
                <div onclick="openModal('tier')" class="bg-[#4A2B0C] px-3 py-2 rounded-xl text-right cursor-pointer hover:bg-[#3d2309] transition border border-white/5">
                    <div class="text-xs font-black text-white tracking-wide flex items-center gap-1 justify-end">${tierName} <i class="fa-solid fa-circle-info text-[10px] text-amber-400"></i></div>
                    <div class="text-[10px] font-bold text-amber-400">${tierDiscount}</div>
                </div>
            </div>
            <div class="flex justify-between items-end border-t border-[#4A2B0C] pt-4 z-10 mt-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#4A2B0C] rounded-full flex items-center justify-center text-base font-bold text-amber-400">
                        ${(m.profile?.name ? m.profile.name.charAt(0).toUpperCase() : 'B')}
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white tracking-wide">${m.profile?.name || "-"}</h2>
                        <p class="text-[11px] text-[#C2B2A2]"><i class="fa-solid fa-phone text-[10px] mr-1"></i>${m.profile?.phone || "-"}</p>
                    </div>
                </div>
                <div class="text-right text-[10px] text-[#C2B2A2]"><p>Valid Till: ${points.expiry || "-"}</p></div>
            </div>
        </section>

        <!-- 栏目 2：三大核心固化卡券 (在 PC 端占 2 列) -->
        <section class="bg-white rounded-3xl p-5 border border-[#F2E4D4] premium-shadow lg:col-span-2">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-extrabold text-xs text-[#633A11] uppercase tracking-wider">🎁 Your Vouchers</h3>
                <span class="text-[11px] text-[#8C745A] font-semibold md:hidden flex items-center gap-1">Swipe <i class="fa-solid fa-arrow-right text-[9px]"></i></span>
            </div>
            <div id="voucherScrollContainer" class="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto pb-1 no-scrollbar snap-x">
                
                <div class="min-w-[250px] md:min-w-0 bg-[#FAF6F0] border border-[#EADCC9] rounded-2xl p-4 flex flex-col justify-between snap-start shadow-sm">
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex-1 min-w-0">
                            <span class="text-[9px] bg-[#E8DDFF] text-[#6200EE] font-black px-2 py-0.5 rounded-md tracking-wider uppercase">SPIN</span>
                            <h4 class="font-extrabold text-sm text-[#633A11] mt-1.5 whitespace-normal break-words leading-tight">${m.reward?.name || "Not Issued"}</h4>
                            <p class="text-[10px] text-gray-400 font-medium mt-1">Token: ${m.reward?.token || "-"}</p>
                        </div>
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-[#E8DDFF]/40 flex items-center justify-center text-2xl select-none ${(!spinExp && m.reward?.token && !(m.reward?.status || "").includes("Redeem")) ? 'gift-bounce' : ''}">
                            🎡
                        </div>
                    </div>
                    <div class="mt-4 pt-2 border-t border-[#EADCC9]/40 flex justify-between items-center">
                        <span class="text-[9px] text-gray-400">Exp: ${formatDateOnly(m.reward?.expiry)}</span>
                        <div id="box-spin">${!(m.reward?.token) ? `<span class="text-xs text-gray-400 font-bold">-</span>` : renderActionBtnHtml(!spinExp, (m.reward?.status || "").includes("Redeem"), spinExp, `triggerPasscodeAction('spin', '${m.reward?.name}', 'box-spin', '${m.profile.phone}')`, 'btn-spin')}</div>
                    </div>
                </div>

                <div class="min-w-[250px] md:min-w-0 bg-[#FAF6F0] border border-[#EADCC9] rounded-2xl p-4 flex flex-col justify-between snap-start shadow-sm">
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex-1 min-w-0">

// 渲染积分商品布局（融合自两用版高级版面网格，且保留了原本完整的参数调用）
function renderCatalogTier(catalog, currentPoints, phone){
    if(!catalog || !catalog.length) return "<div class='col-span-full text-center py-4 text-xs text-gray-400'>No items available</div>";
    
    const isMobile = window.innerWidth < 768;
    const slicedCatalog = (!isCatalogExpanded && isMobile) ? catalog.slice(0, 4) : catalog;
    let html = "";
    
    slicedCatalog.forEach((item, index) => {
        const canRedeem = currentPoints >= item.points;
        const diff = item.points - currentPoints;
        let actionAreaHtml = "";
        
        if(canRedeem) {
            if(isStaffMode) {
                actionAreaHtml = `<button id="btn-catalog-${index}" onclick="triggerCatalogAction('${item.reward.replace(/'/g, "\\'")}', ${item.points}, 'box-catalog-${index}', '${phone}')" class="w-full bg-rose-600 text-white text-center text-xs py-1.5 rounded-xl font-extrabold transition active:scale-95 cursor-pointer">REDEEM</button>`;
            } else {
                actionAreaHtml = `<div class="w-full bg-emerald-100 text-emerald-800 text-center text-[11px] py-1.5 rounded-xl font-extrabold cursor-default select-none">Available</div>`;
            }
        } else {
            actionAreaHtml = `<div class="w-full bg-gray-200/60 text-gray-400 text-center text-[10px] py-1.5 rounded-xl font-bold">Need ${diff} Pts</div>`;
        }
        
        html += `
            <div class="bg-[#FAF6F0] rounded-2xl p-3 flex flex-col justify-between border border-[#EADCC9] shadow-sm">
                <div>
                    <div class="w-full h-24 bg-white rounded-xl flex items-center justify-center text-3xl overflow-hidden relative shadow-inner">
                        ${item.image ? `<img class="w-full h-full object-cover" src="${item.image}">` : "🎁"}
                    </div>
                    <div class="mt-2.5">
                        <h4 class="font-extrabold text-xs text-[#633A11] tracking-tight line-clamp-1">${item.reward}</h4>
                        <p class="text-xs font-black text-[#B87E31] mt-0.5">${item.points} Pts</p>
                    </div>
                </div>
                <div class="mt-3" id="box-catalog-${index}">${actionAreaHtml}</div>
            </div>`;
    });

    if (isMobile && catalog.length > 4) {
        html += `
            <div class="col-span-full pt-2">
                <button onclick="toggleCatalogView()" class="w-full bg-gray-100 hover:bg-gray-200/70 text-[#633A11] text-xs font-bold py-2 rounded-xl transition flex items-center justify-center gap-1 border border-gray-200/40 cursor-pointer">
                    <span>${isCatalogExpanded ? 'Collapse Items' : `View All Store Items (${catalog.length})`}</span>
                    <i class="fa-solid ${isCatalogExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-[10px]"></i>
                </button>
            </div>`;
    }
    return html;
}

/**
 * 🔄 精准核销后同步刷新处理器
 * 已经移除了所有自动轮询定时器。只有在店员真实核销成功后，才会被动触发运行一次。
 */
async function executeRefreshAfterRedeem(){
    let phone = document.getElementById("phone").value.trim();
    let email = document.getElementById("email").value.trim();
    if(!phone && !email) return;

    const syncIndicator = document.getElementById("syncIndicator");
    if(syncIndicator) {
        syncIndicator.classList.remove("opacity-0");
        syncIndicator.classList.add("animate-pulse"); // 闪烁提示正在安全拉取最新状态
    }

    let url = "https://script.google.com/macros/s/AKfycbyw_wc2HirKbFq6Yn6sL2YC_SpXZb0J5K2Kd-k0uKYfRTwhXHg6sy_RbFzSYV6w8NCp5A/exec?mode=member";
    if(phone) url += "&phone=" + encodeURIComponent(phone);
    if(email) url += "&email=" + encodeURIComponent(email);

    try {
        let res = await fetch(url);
        let data = await res.json();
        if(data.status === "ok") {
            cachedMemberData = data.data; 
            // 重新渲染整个主页，由于核销成功，此时对应按钮会自动渲染为 Used / 已过期 / 锁定，积分和印章也会实时更新
            if(cachedMemberData) { renderAllUI(cachedMemberData); }
        }
    } catch(err) { 
        console.error("Failed to sync fresh member data after redeem:", err); 
    } finally {
        if(syncIndicator) {
            syncIndicator.classList.remove("animate-pulse");
            setTimeout(() => syncIndicator.classList.add("opacity-0"), 500);
        }
    }
}

// ==================== 🔌 settingfix2 安全核销控制中心 ====================
function verifyStaffAccessSecurity() {
    let backendPasscode = "B51368"; 

    if (cachedMemberData && cachedMemberData.settings) {
        const s = cachedMemberData.settings;
        if (s.REDEEM_PASSCODE !== undefined && s.REDEEM_PASSCODE !== null && String(s.REDEEM_PASSCODE).trim() !== "") {
            backendPasscode = String(s.REDEEM_PASSCODE).trim(); 
        }
    }

    const inputPin = prompt("🔑 Enter B5 Staff Passcode to verify authorization:");
    if(!inputPin) {
        alert("Operation denied: Password verification required.");
        return null;
    }
    if(inputPin.trim() !== backendPasscode) {
        alert("❌ Access Denied: Incorrect staff passcode!");
        return null;
    }

    const staffName = prompt("✍️ Security Verified! Now enter Staff Name/Initial for audit records:");
    if(!staffName || staffName.trim().length < 2) {
        alert("Operation cancelled: Valid staff identifier is required.");
        return null;
    }
    return staffName.trim();
}

async function triggerPasscodeAction(type, itemDisplayName, targetBoxId, phone) {
    const containerBox = document.getElementById(targetBoxId);
    let originalHtml = containerBox.innerHTML;
    const staffName = verifyStaffAccessSecurity();
    if(!staffName) return; 

    // 1. 按钮即时变为验证状态，防止重复狂点
    containerBox.innerHTML = `<div class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-spinner animate-spin mr-1"></i>Verifying...</div>`;
    let url = "https://script.google.com/macros/s/AKfycbyw_wc2HirKbFq6Yn6sL2YC_SpXZb0J5K2Kd-k0uKYfRTwhXHg6sy_RbFzSYV6w8NCp5A/exec"
            + "?mode=passcode_redeem"
            + "&phone=" + encodeURIComponent(phone)
            + "&type=" + encodeURIComponent(type)
            + "&staff=" + encodeURIComponent(staffName);

    try {
        let res = await fetch(url);
        let data = await res.json();
        if(data.status === "ok"){ 
            // 先锁定前台视觉为 Used 状态，确保网络重绘间隙用户体验不卡顿
            containerBox.innerHTML = `<span class="text-[10px] text-gray-400 font-bold bg-gray-100 px-2.5 py-1 rounded-lg select-none cursor-default">Used</span>`;
            showReceipt(itemDisplayName, staffName); 
            // 2. 核心功能触发：核销成功后自动触发全量同步，Apps Script 瞬间跑一次拉取最新数据
            await executeRefreshAfterRedeem(); 
        } 
        else { alert("❌ Backend Denied: " + data.status); containerBox.innerHTML = originalHtml; }
    } catch (err) { alert("⚠️ Connection Timeout."); containerBox.innerHTML = originalHtml; }
}

        } 
        else { alert("❌ Backend Denied: " + data.status); containerBox.innerHTML = originalHtml; }
    } catch (err) { alert("⚠️ Network Error."); containerBox.innerHTML = originalHtml; }
}
</script>
</body>
