<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B5 Member & Admin Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF6F0;
            color: #4A3419;
        }
        .premium-shadow {
            box-shadow: 0 10px 25px -5px rgba(99, 58, 17, 0.06);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes custom-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.15); }
        }
        .gift-bounce {
            animation: custom-bounce 1.2s infinite ease-in-out;
            display: inline-block;
        }

        /* 🔒 Security Gate Interface */
        #b5SecurityGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FAF6F0;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .security-card {
            max-width: 400px;
            width: 90%;
            padding: 35px 25px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(99, 58, 17, 0.1);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #F2E4D4;
        }
        .input-control {
            width: 100%;
            background-color: #FAF6F0;
            border: 1px solid #EADCC9;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
            color: #4A3419;
            transition: all 0.2s;
        }
        .input-control:focus {
            outline: none;
            border-color: #633A11;
            background-color: #ffffff;
        }
        .btn-block {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn-main { background: #633A11; color: white; margin-top: 6px; margin-bottom: 12px; }
        .btn-main:hover { background: #4A2B0C; }
        .status-msg { font-size: 12px; margin-top: 12px; font-weight: 600; text-align: center; }
    </style>
</head>
<body class="pb-24">

    <!-- 成功横幅提示 -->
    <div id="receiptNotice" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100000] w-11/12 max-w-sm bg-emerald-600 text-white p-4 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-sm">✅</div>
            <div class="flex-1">
                <h4 id="receiptTitle" class="font-extrabold text-sm tracking-wide">Redeem Successful!</h4>
                <p id="receiptDetails" class="text-[11px] text-emerald-100 mt-0.5">Item processed securely.</p>
            </div>
            <button onclick="closeReceipt()" class="text-white/60 hover:text-white text-xs font-bold px-2 cursor-pointer">Dismiss</button>
        </div>
    </div>

    <!-- =========================================================================
       🔒 Login Gate (支持输入 Phone/Email + 可选 Spend Amount 快捷加积分)
       ========================================================================= -->
    <div id="b5SecurityGate">
        <div id="b5LoginPanel" class="security-card">
            <h2 class="text-xl font-extrabold text-[#633A11] mb-1">🎁 B5 Cuisine Cafe</h2>
            <p class="text-xs text-[#8C745A] font-medium mb-6">Member & Admin Quick Portal Access</p>
            
            <form onsubmit="event.preventDefault(); handleDirectLogin();" novalidate>
                <!-- 1. 电话号码 -->
                <input type="text" id="loginPhone" onblur="normalizePhone(this)" class="input-control" placeholder="Phone Number (e.g. 0123456789)" />
                
                <!-- 2. Email（可选） -->
                <input type="email" id="loginEmail" class="input-control" placeholder="Email Address (Optional)" />

                <!-- 3. 💳 消费金额加积分（可选，快捷功能） -->
                <div class="relative">
                    <input type="number" id="loginAmount" step="0.01" oninput="updateAmountPreview(this.value)" class="input-control !mb-1 text-emerald-800 font-bold placeholder:font-normal placeholder:text-gray-400" placeholder="Amount Spent RM (Optional to Add Points)" />
                    <p id="amountPreview" class="text-[11px] text-emerald-600 font-extrabold text-left px-1 mb-3 hidden">
                        ✨ Will add +<span id="previewPts">0</span> Points upon login
                    </p>
                </div>

                <button type="submit" class="btn-block btn-main shadow-sm cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In / Process
                </button>
            </form>
            
            <p id="loginMessage" class="status-msg" style="display: none;"></p>
        </div>
    </div>


    <!-- =========================================================================
       📦 Layer 2: Main Dashboard View
       ========================================================================= -->

    <!-- Rules Modal Container -->
    <div id="detailsModal" class="fixed inset-0 z-[110] bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-all duration-300" id="modalContainer">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 id="modalTitle" class="font-extrabold text-base text-[#633A11]">Rules & Details</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modalBody" class="mt-4 text-xs text-gray-600 space-y-3 leading-relaxed"></div>
        </div>
    </div>

    <!-- Top Sticky Header -->
    <header id="topBar" ondblclick="triggerAdminToggle()" class="bg-[#633A11] text-white px-5 py-4 sticky top-0 z-50 shadow-md flex justify-between items-center w-full select-none cursor-pointer transition-colors duration-300">
        <div class="w-20 text-xs font-bold text-amber-400" id="adminIndicator"></div>
        <h1 class="text-base font-bold flex items-center gap-2 tracking-wide">🎁 B5 Member Portal</h1>
        <div class="w-20 flex justify-end items-center gap-2">
            <div id="syncIndicator" class="opacity-0 transition-opacity duration-300 text-emerald-400 text-xs"><i class="fa-solid fa-rotate animate-spin"></i></div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-md md:max-w-6xl mx-auto px-4 mt-6">
        <!-- Dashboard Output View -->
        <div id="result" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>
    </div>

<script>
const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyw_wc2HirKbFq6Yn6sL2YC_SpXZb0J5K2Kd-k0uKYfRTwhXHg6sy_RbFzSYV6w8NCp5A/exec";

let currentLoggedInIdentity = ""; 
let isStaffMode = false;
let autoRefreshTimer = null;
let isCatalogExpanded = false;
let cachedMemberData = null;

// ⏱️ 5分钟自动 Log out 倒计时控制
let idleTimer = null;
const FIVE_MINUTES_MS = 5 * 60 * 1000;

function startIdleTimer() {
    stopIdleTimer();
    idleTimer = setTimeout(() => {
        alert("⏱️ Auto Timeout: System has automatically logged out after 5 minutes of inactivity.");
        resetPortal();
    }, FIVE_MINUTES_MS);
}

function stopIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
}

function resetIdleTimerOnActivity() {
    if (currentLoggedInIdentity) {
        startIdleTimer();
    }
}

// 绑定全局点击/移动事件，时刻重置5分钟倒计时
['click', 'mousemove', 'keypress', 'touchstart'].forEach(evt => {
    window.addEventListener(evt, resetIdleTimerOnActivity);
});

// 输入 Amount 时的实时加分提示
function updateAmountPreview(val) {
    const previewEl = document.getElementById("amountPreview");
    const ptsEl = document.getElementById("previewPts");
    const num = parseFloat(val);

    if (!isNaN(num) && num > 0) {
        ptsEl.innerText = Math.round(num); // 1 RM = 1 Point
        previewEl.classList.remove("hidden");
    } else {
        previewEl.classList.add("hidden");
    }
}

// 免密码登录逻辑 (兼具加分功能)
async function handleDirectLogin() {
    const phoneInput = document.getElementById("loginPhone");
    normalizePhone(phoneInput);

    const phone = phoneInput ? phoneInput.value.trim() : "";
    const email = document.getElementById("loginEmail") ? document.getElementById("loginEmail").value.trim() : "";
    const amountVal = document.getElementById("loginAmount") ? document.getElementById("loginAmount").value.trim() : "";
    const msgEl = document.getElementById("loginMessage");

    const identity = phone || email;

    if (!identity) {
        showStatusMessage(msgEl, "Please enter Phone Number or Email.", "#C5221F");
        return;
    }

    const amount = parseFloat(amountVal);
    const isAddingPoints = !isNaN(amount) && amount > 0;

    if (isAddingPoints) {
        showStatusMessage(msgEl, `Processing Spend RM ${amount} & Logging In...`, "#633A11");
    } else {
        showStatusMessage(msgEl, "Accessing Portal...", "#633A11");
    }

    currentLoggedInIdentity = identity;

    // 请求后端：支持一次性带上 &amount 进行 Points Log 写入
    const result = await searchProfileByIdentity(currentLoggedInIdentity, true, isAddingPoints ? amount : null);
    
    if (result && result.status === "ok") {
        document.getElementById("b5SecurityGate").style.display = "none";
        
        if (isAddingPoints) {
            showReceipt(`Spent RM ${amount} -> Added +${Math.round(amount)} Points!`, "Staff", "Point Added!");
        }

        startIdleTimer();
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(() => { silentUpdate(); }, 30000);
    } else {
        showStatusMessage(msgEl, "Member Record Not Found.", "#C5221F");
    }
}

function showStatusMessage(el, text, color) {
    if (!el) return;
    el.innerText = text;
    el.style.color = color;
    el.style.display = "block";
}

function toggleCatalogView() {
    isCatalogExpanded = !isCatalogExpanded;
    if(cachedMemberData) { renderAllUI(cachedMemberData); }
}

function resetPortal() {
    stopIdleTimer();
    if(autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    location.reload();
}

function formatDateOnly(dateStr){
    if(!dateStr) return "-";
    const d = new Date(dateStr);
    return d.toLocaleDateString("en-CA");
}

function checkIsExpired(expiryStr) {
    if(!expiryStr) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const exp = new Date(expiryStr); exp.setHours(0,0,0,0);
    return today > exp;
}

function normalizePhone(input){
    if(!input) return;
    let phone=input.value.replace(/[^0-9]/g,"");
    if(phone.startsWith("0")) phone="6"+phone;
    if(!phone.startsWith("60") && phone.startsWith("1")) phone="60" + phone;
    input.value=phone;
}

// 按钮状态生成器 (Staff Mode Inject)
const renderActionBtnHtml = (isAvailable, isRedeemed, isExpired, onClickStr, uniqueId) => {
    if (isExpired) return `<span id="${uniqueId}" class="text-[10px] text-red-500 font-extrabold bg-red-50 px-2 py-1 rounded-lg border border-red-200 select-none cursor-default">Expired</span>`;
    if (isRedeemed) return `<span id="${uniqueId}" class="text-[10px] text-gray-400 font-bold bg-gray-100 px-2.5 py-1 rounded-lg select-none cursor-default">Used</span>`;
    if (!isAvailable) return `<span id="${uniqueId}" class="text-[9px] text-gray-400 font-semibold bg-gray-50 px-2 py-1 rounded-lg border border-dashed select-none cursor-default">Locked</span>`;
    
    if (isStaffMode) {
        return `<button id="${uniqueId}" onclick="${onClickStr}" class="bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-black px-3 py-1 rounded-lg shadow-sm transition active:scale-95 cursor-pointer">REDEEM</button>`;
    } else {
        return `<span id="${uniqueId}" class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-1 rounded-lg cursor-default select-none">Available</span>`;
    }
};

async function searchProfileByIdentity(identity, showLoading = false, addAmount = null){
    if(!identity) return null;

    if(showLoading && document.getElementById("result")) {
        document.getElementById("result").innerHTML="<div class='col-span-full text-center py-10 text-[#8C745A] font-medium'><i class='fa-solid fa-circle-notch animate-spin mr-2'></i>Loading Profile...</div>";
    }

    let url = `${APPS_SCRIPT_WEB_APP_URL}?mode=member`;
    if (identity.includes("@")) {
        url += "&email=" + encodeURIComponent(identity);
    } else {
        url += "&phone=" + encodeURIComponent(identity);
    }

    // 如果有消费金额，带给后端写入 Points Log
    if (addAmount !== null && addAmount > 0) {
        url += "&amount=" + encodeURIComponent(addAmount);
    }

    try {
        let res=await fetch(url);
        let data=await res.json();
        if(data.status !== "ok") {
            if(document.getElementById("result")) {
                document.getElementById("result").innerHTML="<div class='col-span-full bg-white border border-[#F2E4D4] rounded-2xl p-6 text-center text-[#8C745A] premium-shadow max-w-md mx-auto'>No member record found</div>";
            }
            return data;
        }

        cachedMemberData = data.data;
        renderAllUI(cachedMemberData);
        return data;

    } catch(err) { 
        console.error("Identity query error:", err); 
        return null;
    }
}

async function triggerAdminToggle() {
    const indicator = document.getElementById("adminIndicator");
    const topBar = document.getElementById("topBar");

    if (isStaffMode) {
        isStaffMode = false;
        if (indicator) indicator.innerHTML = "";
        if (topBar) topBar.classList.replace("bg-[#4A1D1D]", "bg-[#633A11]");
        
        if (cachedMemberData) {
            await executeRefreshAfterRedeem();
        } else {
            renderAllUI(cachedMemberData);
        }
        alert("Switched back to Customer Mode.");
        return; 
    }

    const inputPasscode = prompt("B5 System: Please enter Staff Passcode to toggle mode:");
    if (inputPasscode === null) return; 
    if (inputPasscode.trim() === "") {
        alert("Passcode cannot be empty.");
        return;
    }

    const url = `${APPS_SCRIPT_WEB_APP_URL}?mode=verify_staff_mode&passcode=${encodeURIComponent(inputPasscode.trim())}`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "ok") {
            isStaffMode = true; 
            if (indicator) indicator.innerHTML = "<span class='bg-rose-950/50 px-2 py-0.5 rounded text-[10px] text-rose-300 font-black animate-pulse'>STAFF</span>";
            if (topBar) topBar.classList.replace("bg-[#633A11]", "bg-[#4A1D1D]");
            alert("Successfully switched to Staff Mode.");
            
            if (cachedMemberData) {
                await executeRefreshAfterRedeem();
            } else {
                renderAllUI(cachedMemberData);
            }
            startIdleTimer();
        } else {
            alert("Invalid Passcode! Access Denied.");
        }
    } catch (err) {
        alert("Network error. Failed to verify passcode.");
    }
}

function renderAllUI(m) {
    if (!m) return;

    const globalIndicator = document.getElementById("adminIndicator");
    const globalTopBar = document.getElementById("topBar");
    if (!isStaffMode && globalIndicator) {
        globalIndicator.innerHTML = "";
        if (globalTopBar) globalTopBar.className = "bg-[#633A11] text-white px-5 py-4 sticky top-0 z-50 shadow-md flex justify-between items-center w-full select-none cursor-pointer transition-colors duration-300";
    }

    const voucherScrollBox = document.getElementById("voucherScrollContainer");
    const savedScrollLeft = voucherScrollBox ? voucherScrollBox.scrollLeft : 0;

    const stamp = m.stamp || { current: 0, limit: 7 };
    const referral = m.referral || { total: 0, tier: "Member" };
    const settings = m.settings || {};
    const points = m.points || { balance: 0, expiry: "-" };

    const th3 = parseInt(settings.referralMilestone3Threshold || "1");
    const th6 = parseInt(settings.referralMilestone6Threshold || "2");
    const th9 = parseInt(settings.referralMilestone9Threshold || "3");
    
    const t10 = parseInt(settings.referralTier10Threshold || "4");
    const t20 = parseInt(settings.referralTier20Threshold || "5");
    const t35 = parseInt(settings.referralTier35Threshold || "6");
    const t50 = parseInt(settings.referralTier50Threshold || "7");

    let tierName = `👤 ${settings.referralTier0Name || "Member"}`;
    let tierDiscount = `${settings.referralTier0Discount || "0%"}`; 
    let tierRewardHtml = "";
    
    const pPhone = m.profile?.phone || currentLoggedInIdentity;

    if (referral.total >= t50) { 
        tierName = `💎 ${settings.referralTier50Name || "Platinum"}`;
        tierDiscount = `${settings.referralTier50Discount || "20%"}`;
        tierRewardHtml = `
            <div class="mt-4 p-3 bg-black/20 rounded-xl border border-white/10 flex justify-between items-center text-left">
                <div>
                    <div class="text-[10px] text-amber-300 font-extrabold uppercase tracking-wider">🎁 Monthly Platinum Reward</div>
                    <div class="text-base font-black text-white mt-0.5">${settings.referralTier50Discount || "Platinum Reward"}</div>
                </div>
                <div id="box-tier50" class="scale-110 shrink-0">${renderActionBtnHtml(true, !!m.tier50_redeemed, false, `triggerMilestoneAction('tier50', 'Monthly Platinum Reward', 'box-tier50', '${pPhone}')`, 'btn-tier50')}</div>
            </div>`;
    }
    else if (referral.total >= t35) { 
        tierName = `🥇 ${settings.referralTier35Name || "Gold"}`;
        tierDiscount = `${settings.referralTier35Discount || "15%"}`;
        tierRewardHtml = `
            <div class="mt-4 p-3 bg-black/20 rounded-xl border border-white/10 flex justify-between items-center text-left">
                <div>
                    <div class="text-[10px] text-amber-300 font-extrabold uppercase tracking-wider">🎁 Monthly Gold Reward</div>
                    <div class="text-base font-black text-white mt-0.5">${settings.referralTier35Discount || "Gold Reward"}</div>
                </div>
                <div id="box-tier35" class="scale-110 shrink-0">${renderActionBtnHtml(true, !!m.tier35_redeemed, false, `triggerMilestoneAction('tier35', 'Monthly Gold Reward', 'box-tier35', '${pPhone}')`, 'btn-tier35')}</div>
            </div>`;
    }
    else if (referral.total >= t20) { 
        tierName = `🥈 ${settings.referralTier20Name || "Silver"}`;
        tierDiscount = `${settings.referralTier20Discount || "10%"}`; 
        tierRewardHtml = `
            <div class="mt-4 p-3 bg-black/20 rounded-xl border border-white/10 flex justify-between items-center text-left">
                <div>
                    <div class="text-[10px] text-amber-300 font-extrabold uppercase tracking-wider">🎁 Monthly Silver Reward</div>
                    <div class="text-base font-black text-white mt-0.5">${settings.referralTier20Discount || "Silver Reward"}</div>
                </div>
                <div id="box-tier20" class="scale-110 shrink-0">${renderActionBtnHtml(true, !!m.tier20_redeemed, false, `triggerMilestoneAction('tier20', 'Monthly Silver Reward', 'box-tier20', '${pPhone}')`, 'btn-tier20')}</div>
            </div>`;
    }
    else if (referral.total >= t10) { 
        tierName = `🥉 ${settings.referralTier10Name || "Bronze"}`;
        tierDiscount = `${settings.referralTier10Discount || "5%"}`;
        tierRewardHtml = `
            <div class="mt-4 p-3 bg-black/20 rounded-xl border border-white/10 flex justify-between items-center text-left">
                <div>
                    <div class="text-[10px] text-amber-300 font-extrabold uppercase tracking-wider">🎁 Monthly Bronze Reward</div>
                    <div class="text-base font-black text-white mt-0.5">${settings.referralTier10Discount || "Bronze Reward"}</div>
                </div>
                <div id="box-tier10" class="scale-110 shrink-0">${renderActionBtnHtml(true, !!m.tier10_redeemed, false, `triggerMilestoneAction('tier10', 'Monthly Bronze Reward', 'box-tier10', '${pPhone}')`, 'btn-tier10')}</div>
            </div>`;
    }
    else {
        tierRewardHtml = `
            <div class="mt-4 p-2 bg-black/10 rounded-xl text-center text-xs text-amber-200/60 italic">
                Invite ${t10 - referral.total} more friends to unlock Monthly Tier Rewards!
            </div>`;
    }

    const spinExp = checkIsExpired(m.reward?.expiry);
    const bdayExp = checkIsExpired(m.birthdayReward?.expiry);
    const promoExp = checkIsExpired(m.promoReward?.expiry);

    const isStamp3UnlockedAndAvailable = (stamp.current >= 3 && !m.stamp3_redeemed);
    const isStamp7UnlockedAndAvailable = (stamp.current >= 7 && !m.stamp7_redeemed);

    const milestones = [th3, th6, th9, t10, t20, t35, t50];

    const stampNodesHtml = Array.from({ length: stamp.limit }).map((_, i) => {
        const stampNum = i + 1;
        const isDone = i < stamp.current;
        const isRewardNode = (stampNum === 3 || stampNum === 7);
        let nodeInnerHtml = `<span>${isDone ? '☕' : stampNum}</span>`;
        let extraNodeClass = "";

        if (isRewardNode) {
            if (stampNum === 3) {
                if (isStamp3UnlockedAndAvailable) {
                    nodeInnerHtml = `<span class="gift-bounce text-xl relative -top-0.5">🎁</span>`;
                    extraNodeClass = "bg-amber-100 text-white border-none scale-125 z-20";
                } else if (m.stamp3_redeemed) {
                    nodeInnerHtml = `<span class="text-[10px]">☕</span>`;
                    extraNodeClass = "bg-[#633A11] text-white";
                } else {
                    nodeInnerHtml = `<span class="opacity-30 text-xs">🎁</span>`;
                    extraNodeClass = "bg-gray-100 text-gray-400 border-gray-300";
                }
            } else if (stampNum === 7) {
                if (isStamp7UnlockedAndAvailable) {
                    nodeInnerHtml = `<span class="gift-bounce text-xl relative -top-0.5">🎁</span>`;
                    extraNodeClass = "bg-amber-100 text-white border-none scale-125 z-20";
                } else if (m.stamp7_redeemed) {
                    nodeInnerHtml = `<span class="text-[10px]">☕</span>`;
                    extraNodeClass = "bg-[#633A11] text-white";
                } else {
                    nodeInnerHtml = `<span class="opacity-30 text-xs">🎁</span>`;
                    extraNodeClass = "bg-gray-100 text-gray-400 border-gray-300";
                }
            }
        } else {
            extraNodeClass = isDone ? 'bg-[#633A11] text-white shadow-sm scale-110' : 'bg-white text-[#CFCFCF] border-dashed border-[#CFCFCF]';
        }
        return `<div class="flex flex-col items-center gap-1 z-10"><div class="w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-black transition-all duration-300 border ${extraNodeClass}">${nodeInnerHtml}</div></div>`;
    }).join("");

    let htmlContent = `
        <div class="col-span-full flex justify-between items-center mt-2">

                <div class="flex justify-between items-center py-2 border-b border-gray-100">
                    <span class="text-gray-400 font-medium"><i class="fa-solid fa-phone w-4"></i> Phone Number</span>
                    <span class="font-bold text-[#633A11]">${p.phone || "-"}</span>
                </div>
                <div class="flex justify-between items-center py-2 border-b border-gray-100">
                    <span class="text-gray-400 font-medium"><i class="fa-solid fa-envelope w-4"></i> Email Address</span>
                    <span class="font-bold text-[#633A11] break-all max-w-[180px] text-right">${p.email || "-"}</span>
                </div>
                <div class="flex justify-between items-center py-2 border-b border-gray-100">
                    <span class="text-gray-400 font-medium"><i class="fa-solid fa-cake-candles w-4"></i> Birthday</span>
                    <span class="font-bold text-[#633A11]">${p.birthday || "-"}</span>
                </div>
            </div>
        </div>`;
    
    modal.classList.remove("opacity-0", "pointer-events-none");
    container.classList.remove("scale-95");
}

function closeModal() {
    const modal = document.getElementById("detailsModal");
    const container = document.getElementById("modalContainer");
    modal.classList.add("opacity-0", "pointer-events-none");
    container.classList.add("scale-95");
}

function renderCatalogTier(catalog, currentPoints, phone){
    if(!catalog || !catalog.length) return "<div class='col-span-full text-center py-4 text-xs text-gray-400'>No items available</div>";
    
    const isMobile = window.innerWidth < 768;
    const slicedCatalog = (!isCatalogExpanded && isMobile) ? catalog.slice(0, 4) : catalog;
    let html = "";
    
    slicedCatalog.forEach((item, index) => {
        const canRedeem = currentPoints >= item.points;
        const diff = item.points - currentPoints;
        let actionAreaHtml = "";
        
        if(canRedeem) {
            if(isStaffMode) {
                actionAreaHtml = `<button id="btn-catalog-${index}" onclick="triggerCatalogAction('${item.reward.replace(/'/g, "\\'")}', ${item.points}, 'box-catalog-${index}', '${phone}')" class="w-full bg-rose-600 text-white text-center text-xs py-1.5 rounded-xl font-extrabold transition active:scale-95 cursor-pointer">REDEEM</button>`;
            } else {
                actionAreaHtml = `<div class="w-full bg-emerald-100 text-emerald-800 text-center text-[11px] py-1.5 rounded-xl font-extrabold cursor-default select-none">Available</div>`;
            }
        } else {
            actionAreaHtml = `<div class="w-full bg-gray-200/60 text-gray-400 text-center text-[10px] py-1.5 rounded-xl font-bold">Need ${diff} Pts</div>`;
        }
        
        html += `
            <div class="bg-[#FAF6F0] rounded-2xl p-3 flex flex-col justify-between border border-[#EADCC9] shadow-sm">
                <div>
                    <div class="w-full h-24 bg-white rounded-xl flex items-center justify-center text-3xl overflow-hidden relative shadow-inner">
                        ${item.image ? `<img class="w-full h-full object-cover" src="${item.image}">` : "🎁"}
                    </div>
                    <div class="mt-2.5">
                        <h4 class="font-extrabold text-xs text-[#633A11] tracking-tight line-clamp-1">${item.reward}</h4>
                        <p class="text-xs font-black text-[#B87E31] mt-0.5">${item.points} Pts</p>
                    </div>
                </div>
                <div class="mt-3" id="box-catalog-${index}">${actionAreaHtml}</div>
            </div>`;
    });

    if (isMobile && catalog.length > 4) {
        html += `
            <div class="col-span-full pt-2">
                <button onclick="toggleCatalogView()" class="w-full bg-gray-100 hover:bg-gray-200/70 text-[#633A11] text-xs font-bold py-2 rounded-xl transition flex items-center justify-center gap-1 border border-gray-200/40 cursor-pointer">
                    <span>${isCatalogExpanded ? 'Collapse Items' : `View All Store Items (${catalog.length})`}</span>
                    <i class="fa-solid ${isCatalogExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-[10px]"></i>
                </button>
            </div>`;
    }
    return html;
}

function showReceipt(itemName, staffName, customTitle = null) {
    const notice = document.getElementById("receiptNotice");
    if (customTitle) {
        document.getElementById("receiptTitle").innerText = customTitle;
    } else {
        document.getElementById("receiptTitle").innerText = "Redeem Successful!";
    }
    document.getElementById("receiptDetails").innerHTML = `<b>Details:</b> ${itemName}<br><b>Operator:</b> ${staffName}`;
    notice.classList.remove("opacity-0", "pointer-events-none", "translate-y-[-20px]");
    setTimeout(closeReceipt, 5000);
}

function closeReceipt() {
    document.getElementById("receiptNotice").classList.add("opacity-0", "pointer-events-none", "translate-y-[-20px]");
}

async function executeRefreshAfterRedeem() {
    if(!currentLoggedInIdentity) return;
    
    const syncIndicator = document.getElementById("syncIndicator");
    if(syncIndicator) {
        syncIndicator.classList.remove("opacity-0");
        syncIndicator.classList.add("animate-pulse"); 
    }

    try {
        let url = `${APPS_SCRIPT_WEB_APP_URL}?mode=member`;
        if (currentLoggedInIdentity.includes("@")) {
            url += "&email=" + encodeURIComponent(currentLoggedInIdentity);
        } else {
            url += "&phone=" + encodeURIComponent(currentLoggedInIdentity);
        }

        let res = await fetch(url);
        let data = await res.json();
        
        if(data.status === "ok") {
            cachedMemberData = data.data; 
            if(cachedMemberData) { renderAllUI(cachedMemberData); }
        }
    } catch(err) { 
        console.error("Failed to sync fresh member data after redeem:", err); 
    } finally {
        if(syncIndicator) {
            syncIndicator.classList.remove("animate-pulse");
            setTimeout(() => syncIndicator.classList.add("opacity-0"), 500);
        }
    }
}

function verifyStaffAccessSecurity() {
    let backendPasscode = "B51368"; 

    if (cachedMemberData && cachedMemberData.settings) {
        const s = cachedMemberData.settings;
        if (s.REDEEM_PASSCODE !== undefined && s.REDEEM_PASSCODE !== null && String(s.REDEEM_PASSCODE).trim() !== "") {
            backendPasscode = String(s.REDEEM_PASSCODE).trim(); 
        }
    }

    const inputPin = prompt("🔑 Enter B5 Staff Passcode to verify authorization:");
    if(!inputPin) {
        alert("Operation denied: Password verification required.");
        return null;
    }
    if(inputPin.trim() !== backendPasscode) {
        alert("❌ Access Denied: Incorrect staff passcode!");
        return null;
    }

    const staffName = prompt("✍️ Security Verified! Now enter Staff Name/Initial for audit records:");
    if(!staffName || staffName.trim().length < 2) {
        alert("Operation cancelled: Valid staff identifier is required.");
        return null;
    }
    return staffName.trim();
}

async function triggerPasscodeAction(type, itemDisplayName, targetBoxId, phone) {
    const containerBox = document.getElementById(targetBoxId);
    let originalHtml = containerBox.innerHTML;
    const staffName = verifyStaffAccessSecurity();
    if(!staffName) return; 

    containerBox.innerHTML = `<div class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-spinner animate-spin mr-1"></i>Verifying...</div>`;
    let url = `${APPS_SCRIPT_WEB_APP_URL}?mode=passcode_redeem&phone=${encodeURIComponent(phone)}&type=${encodeURIComponent(type)}&staff=${encodeURIComponent(staffName)}`;

    try {
        let res = await fetch(url);
        let data = await res.json();
        if(data.status === "ok"){ 
            containerBox.innerHTML = `<span class="text-[10px] text-gray-400 font-bold bg-gray-100 px-2.5 py-1 rounded-lg select-none cursor-default">Used</span>`;
            showReceipt(itemDisplayName, staffName); 
            await executeRefreshAfterRedeem(); 
        } 
        else { alert("❌ Backend Denied: " + data.status); containerBox.innerHTML = originalHtml; }
    } catch (err) { alert("⚠️ Connection Timeout."); containerBox.innerHTML = originalHtml; }
}

async function triggerMilestoneAction(type, itemDisplayName, targetBoxId, phone) {
    const containerBox = document.getElementById(targetBoxId);
    if (!containerBox) return;

    const staffName = verifyStaffAccessSecurity();
    if (!staffName) return;

    const originalHtml = containerBox.innerHTML;
    containerBox.innerHTML = `<div class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-spinner animate-spin mr-1"></i>Processing...</div>`;

    const url = `${APPS_SCRIPT_WEB_APP_URL}?mode=milestone_redeem&phone=${encodeURIComponent(phone)}&type=${encodeURIComponent(type)}&staff=${encodeURIComponent(staffName)}`;

    try {
        let res = await fetch(url);
        let data = await res.json();

        if (data.status === "ok" || data.status === "already_redeemed") {
            containerBox.innerHTML = `<span class="text-[10px] text-gray-400 font-bold bg-gray-100 px-2.5 py-1 rounded-lg select-none cursor-default">Used</span>`;
            if (data.status === "ok") {
                showReceipt(itemDisplayName, staffName);
            }
            await executeRefreshAfterRedeem();
        } else {
            alert("❌ Backend Denied: " + data.status);
            containerBox.innerHTML = originalHtml;
        }
    } catch (err) {
        alert("⚠️ Connection Timeout.");
        containerBox.innerHTML = originalHtml;
    }
}

async function triggerCatalogAction(rewardName, pointsValue, targetBoxId, phone) {
    const containerBox = document.getElementById(targetBoxId);
    let originalHtml = containerBox.innerHTML;
    const staffName = verifyStaffAccessSecurity();
    if(!staffName) return;

    const ok = confirm(`Confirm Store Redemption?\n\nReward: ${rewardName}\nCost: ${pointsValue} Pts\nStaff Signature: ${staffName}`);
    if(!ok) return;

    containerBox.innerHTML = `<div class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-spinner animate-spin mr-1"></i>Deducting...</div>`;
    const url = `${APPS_SCRIPT_WEB_APP_URL}?mode=redeem&phone=${encodeURIComponent(phone)}&reward=${encodeURIComponent(rewardName)}&points=${encodeURIComponent(pointsValue)}&staff=${encodeURIComponent(staffName)}`;

    try {
        const res = await fetch(url);
        const data = await res.json();
        if(data.status === "ok"){ 
            showReceipt(`${rewardName} (Balance: ${data.remaining} Pts)`, staffName); 
            await executeRefreshAfterRedeem(); 
        } 
        else { alert("❌ Backend Denied: " + data.status); containerBox.innerHTML = originalHtml; }
    } catch (err) { alert("⚠️ Network Error."); containerBox.innerHTML = originalHtml; }
}

// =========================================================================
// 📜 独立渲染积分与兑换历史 (最新 5 条，严格按时间倒序)
// =========================================================================
function renderRedeemHistoryUI(historyData) {
    const container = document.getElementById("redeemHistoryContainer");
    if (!container) return;

    if (!historyData || historyData.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-xs text-gray-400">No activity history found.</div>`;
        return;
    }

    // 辅助函数：把各种格式的时间转成 Timestamp 以便排序
    function parseDate(dateStr) {
        if (!dateStr) return 0;
        // 如果已经是 Date 对象
        if (dateStr instanceof Date) return dateStr.getTime();
        
        let str = String(dateStr).trim();
        // 处理 dd/MM/yyyy HH:mm:ss 格式
        if (str.includes('/')) {
            const parts = str.split(' ');
            const dateParts = parts[0].split('/');
            if (dateParts.length === 3) {
                const day = dateParts[0];
                const month = dateParts[1] - 1;
                const year = dateParts[2];
                const time = parts[1] || "00:00:00";
                return new Date(`${year}-${month + 1}-${day} ${time}`).getTime() || new Date(str).getTime();
            }
        }
        return new Date(str).getTime() || 0;
    }

    // 🎯 1. 核心改进：先把全部数据按时间【从最新到最旧】排序！
    const sortedHistory = [...historyData].sort((a, b) => {
        const timeA = parseDate(a.date || a.redeemedAt || a.timestamp);
        const timeB = parseDate(b.date || b.redeemedAt || b.timestamp);
        return timeB - timeA; // 降序：最新的排在最前面
    });

    // 🎯 2. 排序完成后，只取最新的前 5 条
    const recentHistory = sortedHistory.slice(0, 5);
    
    let html = "";
    recentHistory.forEach(item => {
        const rawPts = item.pointsUsed !== undefined ? item.pointsUsed : (item.points !== undefined ? item.points : item.pointsAdded);
        const pts = Number(rawPts || 0);
        const source = String(item.rewardName || item.reward || item.title || item.source || '');
        
        // 判断加分、扣分还是 0 变动
        const isAdd = source.includes("Add Point") || source.includes("Quick Add") || pts > 0;
        const displayTitle = isAdd ? (item.rewardName || item.title || 'Add Point') : (item.rewardName || item.reward || item.title || 'Redeemed Item');
        
        let pointsText = "";
        let pointsColorClass = "";

        if (pts === 0) {
            pointsText = "Free / 0 Pts";
            pointsColorClass = "text-gray-400"; // 0 分变动用灰色
        } else if (isAdd) {
            pointsText = `+${Math.abs(pts)} Pts`;
            pointsColorClass = "text-emerald-600 font-extrabold"; // 加分绿色
        } else {
            pointsText = `-${Math.abs(pts)} Pts`;
            pointsColorClass = "text-[#C5221F] font-extrabold"; // 扣分红色
        }

        html += `
            <div class="flex justify-between items-center bg-[#FAF6F0] border border-[#EADCC9] p-3 rounded-xl text-xs">
                <div>
                    <span class="font-bold text-[#633A11]">${displayTitle}</span>
                    <p class="text-[10px] text-gray-400 mt-0.5">${item.date || item.redeemedAt || item.timestamp || '-'}</p>
                </div>
                <div class="${pointsColorClass}">
                    ${pointsText}
                </div>
            </div>`;
    });
    
    container.innerHTML = html;
}
